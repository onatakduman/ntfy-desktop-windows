name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Build (Release x64)
        run: dotnet build NtfyDesktop.csproj -c Release -p:Platform=x64 -r win-x64

      - name: Build (Release ARM64)
        run: dotnet build NtfyDesktop.csproj -c Release -p:Platform=ARM64 -r win-arm64
