name: Release

# Push a tag like v1.0.2 to build both architectures, package MSIX files
# (version 1.0.2.0), attach them to a GitHub Release, and submit them to
# the Microsoft Store (if the MSSTORE_* secrets are configured).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  STORE_APP_ID: 9PJDD0JKR719

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Set package version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got: ${{ github.ref_name }}" }
          $manifest = Get-Content Package.appxmanifest -Raw
          # Only the Identity Version: the (?<![\w]) guard keeps MinVersion /
          # MaxVersionTested (the supported Windows versions) untouched.
          $pattern = '(?<![\w])Version="\d+\.\d+\.\d+\.\d+"'
          $count = ([regex]::Matches($manifest, $pattern)).Count
          if ($count -ne 1) { throw "Expected exactly one Identity Version in Package.appxmanifest, found $count" }
          $manifest = [regex]::Replace($manifest, $pattern, "Version=""$version.0""")
          Set-Content Package.appxmanifest $manifest -NoNewline
          "PKG_VERSION=$version.0" >> $env:GITHUB_ENV

      # -r is explicit: the project otherwise picks the runtime from the build
      # machine's architecture (x64), which breaks the ARM64 build.
      - name: Build x64
        run: dotnet build NtfyDesktop.csproj -c Release -p:Platform=x64 -r win-x64

      - name: Build ARM64
        run: dotnet build NtfyDesktop.csproj -c Release -p:Platform=ARM64 -r win-arm64

      - name: Install winapp CLI
        shell: pwsh
        run: |
          gh release download -R microsoft/winappcli --pattern "winappcli-x64.zip" --dir winappcli
          Expand-Archive winappcli\winappcli-x64.zip -DestinationPath winappcli\bin
          $exeDir = (Get-ChildItem winappcli\bin -Recurse -Filter winapp.exe | Select-Object -First 1).DirectoryName
          $exeDir >> $env:GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package MSIX (unsigned, for Store)
        shell: pwsh
        run: |
          New-Item -ItemType Directory packages | Out-Null
          winapp package "bin\x64\Release\net9.0-windows10.0.26100.0\win-x64"   --manifest .\Package.appxmanifest --output "packages\notidesk_${env:PKG_VERSION}_x64.msix"
          winapp package "bin\ARM64\Release\net9.0-windows10.0.26100.0\win-arm64" --manifest .\Package.appxmanifest --output "packages\notidesk_${env:PKG_VERSION}_arm64.msix"
          Get-ChildItem packages

      # The Store takes one upload per submission, so both architectures go into
      # a single bundle (msstore publish doesn't accept a folder of .msix files).
      - name: Bundle MSIX packages
        shell: pwsh
        run: |
          # makeappx from the Windows SDK BuildTools package the build restored
          # (pinned in NtfyDesktop.csproj), so it knows the manifest schemas.
          $makeappx = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.buildtools" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the SDK BuildTools package" }
          Write-Host "makeappx: $($makeappx.FullName)"
          New-Item -ItemType Directory bundle | Out-Null
          & $makeappx.FullName bundle /d packages /p "bundle\notidesk_${env:PKG_VERSION}.msixbundle" /bv $env:PKG_VERSION /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed ($LASTEXITCODE)" }
          Get-ChildItem bundle

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem packages\*.msix) + @(Get-ChildItem bundle\*.msixbundle) | ForEach-Object FullName
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-run of the same tag: replace the assets instead of failing.
            gh release upload "${{ github.ref_name }}" $assets --clobber
          } else {
            gh release create "${{ github.ref_name }}" $assets `
              --title "Notidesk ${{ github.ref_name }}" `
              --generate-notes `
              --notes "Store-ready unsigned MSIX packages (installed builds come from the Microsoft Store: https://apps.microsoft.com/detail/9PJDD0JKR719)"
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Store credentials
        id: store-creds
        shell: pwsh
        run: |
          $configured = "${{ secrets.MSSTORE_CLIENT_ID }}" -ne ""
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) { Write-Host "MSSTORE_* secrets not set - skipping Store submission." }

      - name: Setup msstore CLI
        if: steps.store-creds.outputs.configured == 'true'
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to Microsoft Store
        if: steps.store-creds.outputs.configured == 'true'
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" `
            --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" `
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" `
            --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
          msstore publish "bundle\notidesk_${env:PKG_VERSION}.msixbundle" --appId $env:STORE_APP_ID
